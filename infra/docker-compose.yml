version: "3.9"

# Local dev only. Production deploy (Fly.io/Railway/etc.) is a separate
# concern — see infra/deploy/.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_bank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Local dev uses plain HTTP. Add the ACME/Let's Encrypt entrypoint
      # here when you have a real domain for staging/production.
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "8081:8080" # Traefik dashboard, dev only — do not expose in prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/digital_bank?sslmode=disable
      # OIDC_ISSUER_URL / OIDC_CLIENT_ID: set these once you have an Auth0
      # (or Keycloak) app configured — auth routes stay disabled without them.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

volumes:
  pgdata:
